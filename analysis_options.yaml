# Workspace-root analyzer configuration.
#
# Intentionally minimal: every workspace package carries its own
# `analysis_options.yaml`, and this file must not shadow them. It exists for
# one reason: the two consumer fixtures below.
#
# `open_code/fixture/` and `open_code/agent_fixture/` are standalone consumer
# applications, not workspace members (see open_code/README.md). Each resolves
# its dependencies inside the throwaway app that its checker assembles
# (`tool/check_open_code.dart` and `tool/check_agent_consumer.dart`), so
# neither has a `.dart_tool/package_config.json` here and their `package:`
# imports cannot resolve in this checkout. Each pubspec makes a nested
# analysis context, so a root-level `dart analyze` would descend into them and
# report every import as missing.
#
# Excluding them does not weaken coverage: each checker runs `flutter analyze`
# over that exact source in the assembled app, where its dependencies are real.
# `open_code/templates/` is deliberately *not* excluded -- it has no pubspec of
# its own, so it analyzes in this context against the workspace's `remix` and
# `mix_annotations`.
analyzer:
  exclude:
    - open_code/fixture/**
    - open_code/agent_fixture/**
