name: agent_consumer_fixture
description: A fresh application that proves an installed recipe styles remix_agent surfaces.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

# This is the pre-install manifest. The checker adds `remix_cli` as a temporary
# path development dependency, then the CLI adds `remix`, `mix_annotations`,
# `build_runner`, and `mix_generator` itself.
#
# `remix_agent` is the one dependency the CLI cannot add. The package is
# private, so there is no hosted version to name and no registry item that
# declares one. The checker supplies the source through a temporary
# `pubspec_overrides.yaml`, which is what "develop the first consumer with
# explicit checkout overrides" means in practice. The constraint stays `any`
# because inventing a floor here would claim a release that does not exist.
dependencies:
  flutter:
    sdk: flutter
  remix_agent: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
