name: dashboard
description: Workspace-only Fortal dashboard example showcasing Remix theming and components.
publish_to: "none"
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  remix:
    path: ../remix
  remix_fortal:
    path: ../remix_fortal

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
