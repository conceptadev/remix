name: remix_agent
description: >
  Agent-run UI surfaces for Remix. Unstyled conversation, permission, and
  progress widgets with no theme, no token scope, and no model SDK.
publish_to: none
repository: https://github.com/btwld/remix
issue_tracker: https://github.com/btwld/remix/issues
license: BSD-3-Clause
resolution: workspace
version: 0.1.0-beta.1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Hosted pin; workspace resolution binds the local sibling.
  remix: ^1.0.0-beta.4

dev_dependencies:
  flutter_test:
    sdk: flutter
