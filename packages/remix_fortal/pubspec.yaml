name: remix_fortal
description: Fortal is a Radix Themes-inspired preset theme and widget catalog built on Remix.
repository: https://github.com/btwld/remix
documentation: https://docs.page/btwld/remix/fortal
issue_tracker: https://github.com/btwld/remix/issues
license: BSD-3-Clause
resolution: workspace
topics:
  - design-system
  - ui
  - widgets
  - styling
  - mix

# Pre-release because every dependency below is itself a pre-release; pub warns
# when a stable package is built on beta foundations. Graduate to 0.1.0 when
# remix reaches 1.0.0 stable.
version: 0.1.0-beta.3

# Consumer floor, matching `remix` and `mix`. See packages/remix/pubspec.yaml.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Tracks the sibling `remix` version automatically: release-please rewrites the
  # annotated line below whenever it bumps `remix` (see the `extra-files` entry
  # for packages/remix in release-please-config.json). During development pub
  # resolves this to the local sibling anyway via `resolution: workspace`.
  #
  # The floor must name a `remix` that no longer exports Fortal. Releases up to
  # and including 1.0.0-beta.1 still bundled FortalScope/FortalTokens/Fortal*, so
  # `remix` has to cut its Fortal-free release before `remix_fortal` is published
  # — otherwise pub could resolve a `remix` whose symbols collide with this
  # package. `tool/fortal_parity/check.dart` (_checkRemixHostedPin) fails if the
  # two ever fall out of sync. `melos version` rewrites this line when `remix`
  # bumps, because remix_fortal depends on it.
  remix: ^1.0.0-beta.4
  mix: ^2.2.0-beta.4
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.1
  naked_ui: ^1.0.0-beta.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  mix_generator: ^2.2.0-beta.2

flutter:
  fonts:
    - family: FortalIcons
      fonts:
        - asset: lib/src/radix/icons/generated/fonts/FortalIcons.otf
