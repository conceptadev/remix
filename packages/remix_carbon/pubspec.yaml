name: remix_carbon
description: >-
  Carbon for Flutter — a Flutter-native implementation of the IBM Carbon Design
  System, built on the Remix, Naked UI and Mix foundations.
repository: https://github.com/btwld/remix
issue_tracker: https://github.com/btwld/remix/issues
license: Apache-2.0
resolution: workspace
topics:
  - design-system
  - ui
  - widgets
  - styling
  - carbon

# Publication still requires the package-name and IBM trademark review tracked
# in the architecture ADR. Runtime dependencies already use hosted constraints,
# so git consumers exercise the same resolution contract as a future release.
publish_to: none

# Pre-1.0: foundations + the pinned Carbon core and chart component catalog.
version: 0.0.2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  mix: ^2.2.0-beta.4
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.1
  # Release Please keeps this aligned with the sibling Remix release. The
  # workspace resolves it locally; git consumers resolve the hosted version.
  remix: ^1.0.0-beta.4 # x-release-please-version

dev_dependencies:
  build_runner: ^2.10.1
  dart_code_metrics_presets: ^2.32.0
  flutter_test:
    sdk: flutter
  mix_generator: ^2.2.0-beta.2

flutter:
  fonts:
    - family: CarbonIcons
      fonts:
        - asset: lib/src/icons/generated/fonts/CarbonIcons.otf
