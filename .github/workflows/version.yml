name: Prepare Version PR

# Opens a pull request that bumps versions and changelogs from conventional
# commits. It never tags and never publishes: `publish.yml` fires on a tag push,
# so the tag is pushed by hand after this PR is reviewed and merged.
#
# Requires "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General). `GITHUB_TOKEN` cannot open a pull request
# without it, and that restriction applies to the `gh` CLI too, because `gh`
# authenticates with the same token. If the setting cannot be enabled, supply a
# PAT or GitHub App token as `GH_TOKEN` on the final step instead.

on:
  workflow_dispatch:
    inputs:
      remix_version:
        description: "Exact version for remix (e.g. 1.0.0-beta.5). Cannot be combined with graduate."
        required: false
        default: ""
      remix_fortal_version:
        description: "Exact version for remix_fortal (e.g. 0.1.0-beta.4). Cannot be combined with graduate."
        required: false
        default: ""
      graduate:
        description: "Graduate the prerelease line to stable instead of bumping beta"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Bump versions and changelogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # melos derives each package's last release from its `<package>-v*`
          # tag, so the full history and all tags must be present. A shallow
          # clone makes it walk every commit and rewrite the whole changelog.
          fetch-depth: 0

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump versions
        id: bump
        run: |
          set -euo pipefail

          overrides=""
          if [ -n "${{ inputs.remix_version }}" ]; then
            overrides="$overrides -V remix:${{ inputs.remix_version }}"
          fi
          if [ -n "${{ inputs.remix_fortal_version }}" ]; then
            overrides="$overrides -V remix_fortal:${{ inputs.remix_fortal_version }}"
          fi

          # melos rejects manual versions combined with either mode:
          # "Cannot use manualVersions with asPrerelease or asStableRelease."
          if [ -n "$overrides" ] && [ "${{ inputs.graduate }}" = "true" ]; then
            echo "::error::Exact versions cannot be combined with graduate. Choose one."
            exit 1
          fi

          dart pub global activate melos
          melos bootstrap

          git checkout -b release/version-packages

          # `--no-git-commit-version` is what makes the diff check below
          # meaningful. melos commits by default, which would leave a clean tree
          # and make a successful run look like "nothing to version". It also
          # implies --no-git-tag-version.
          if [ -n "$overrides" ]; then
            melos version --no-git-commit-version --yes $overrides
          elif [ "${{ inputs.graduate }}" = "true" ]; then
            melos version --graduate --no-git-commit-version --yes
          else
            melos version --prerelease --preid beta --no-git-commit-version --yes
          fi

          if git diff --quiet && git diff --cached --quiet; then
            echo "No packages required versioning."
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "versioned=true" >> "$GITHUB_OUTPUT"

          git add -A
          git commit -m "chore(release): version packages"
          git push --set-upstream origin release/version-packages --force

      - name: Open pull request
        if: steps.bump.outputs.versioned == 'true'
        run: |
          set -euo pipefail
          existing=$(gh pr list --head release/version-packages --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "A pull request is already open for release/version-packages; it now carries the new commit."
            exit 0
          fi
          gh pr create \
            --title "chore(release): version packages" \
            --body "Opened by the Prepare Version PR workflow. Review the versions and changelogs, merge, then push the release tags in order — \`remix-v*\` first, wait for pub.dev to serve it, then \`remix_fortal-v*\`." \
            --base main \
            --head release/version-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
