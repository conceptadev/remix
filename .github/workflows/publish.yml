name: Publish to pub.dev

# Two tag-gated jobs rather than one job listing both packages: the reusable
# publish workflow turns `packages:` into a parallel matrix with no ordering
# knob, and `remix_fortal` depends on a hosted `remix`, so a single job would
# race. `remix-v` and `remix_fortal-v` are unambiguous prefixes, so the two `if`
# conditions stay mutually exclusive.
#
# Tags are `<package>-v<version>`, which is what `melos version` looks for when
# it derives each package's last release. The legacy bare `v<version>` pattern
# is kept so tags pushed before that convention still resolve.
#
# The split does not order the two publishes: each tag push starts its own run,
# so `git push --tags` still races. Push remix first, wait for pub.dev to serve
# it, then push the remix_fortal tag. pub.dev does not verify that a dependency
# version exists, so the wrong order ships an uninstallable remix_fortal rather
# than failing the job.
on:
  push:
    tags:
      - 'remix-v[0-9]+.[0-9]+.[0-9]+*'
      - 'remix_fortal-v[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-remix:
    if: >-
      startsWith(github.ref, 'refs/tags/remix-v') ||
      startsWith(github.ref, 'refs/tags/v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@9075ce1232ec77b8747953f2ff4a349190e5a805
    with:
      packages_folder_path: "packages"
      packages: "remix"
    permissions:
      id-token: write
      contents: read

  publish-remix-fortal:
    if: startsWith(github.ref, 'refs/tags/remix_fortal-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@9075ce1232ec77b8747953f2ff4a349190e5a805
    with:
      packages_folder_path: "packages"
      packages: "remix_fortal"
    permissions:
      id-token: write
      contents: read
