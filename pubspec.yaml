name: remix_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dev_dependencies:
  melos: ^8.5.0
  dart_code_metrics_presets: ^2.32.0
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

workspace:
  - apps/dashboard
  - apps/demo
  - apps/playground
  - packages/remix_carbon
  - packages/remix_carbon/example
  - packages/remix
  - packages/remix_fortal
  - packages/remix_ui_icons

melos:
  packages:
    - apps/*
    - packages/*
    # `packages/*` does not cross path separators; nested workspace members
    # must be listed explicitly or melos scripts silently skip them.
    - packages/remix_carbon/example

  # No `command.bootstrap.environment` here on purpose. It rewrites one
  # `environment:` into every package it manages, and this workspace has two
  # legitimate floors: the published libraries ship code that runs on Mix's
  # Flutter 3.41, while the dev toolchain (analyzer, via build_runner) needs
  # meta 1.18 and therefore Flutter 3.44. Melos offers no per-package
  # exemption, so a single managed value could only be wrong for one group.
  # tool/check_toolchain.dart owns both floors and enforces them instead.

  command:
    version:
      # The aggregate workspace changelog is not published and duplicates the
      # per-package ones, so a `melos version` run should not create it.
      workspaceChangelog: false

    bootstrap:
      # Mix floors are managed here so `remix` and `remix_fortal` cannot drift
      # apart. Unlike `environment` above, this is safe to manage centrally:
      # melos skips any package that does not already declare the dependency
      # (see `_updateDependencies` in melos), so the apps keep resolving Mix
      # transitively and never gain a direct dependency.
      #
      # Keep these at the versions actually exercised by CI. Declaring an older
      # floor than we test would claim support for a Mix we never build against.
      # tool/check_consumer_mix.dart enforces the same equality for anyone who
      # edits a pubspec without bootstrapping.
      dependencies:
        # beta.5 is the floor, not a preference: mix_generator 2.2.0-beta.3
        # emits `implements StylerFieldMetadata`, and that symbol first ships
        # in mix 2.2.0-beta.5. Lowering this constraint compiles here but
        # breaks any consumer that resolves beta.4.
        mix: ^2.2.0-beta.5
        mix_annotations: ^2.2.0-beta.1
      dev_dependencies:
        mix_generator: ^2.2.0-beta.3

  scripts:
    # No `release:*` versioning scripts here on purpose. They used to wrap
    # `melos version --prerelease` / `--graduate`, both of which derive a
    # version per package from that package's own commits — which is exactly
    # the drift `version:align:check` now rejects. Run against this workspace
    # they produce `remix 1.0.0-beta.5` and `remix_fortal 0.1.0-beta.4`.
    #
    # `.github/workflows/version.yml` is the only supported path: it takes one
    # version and applies it to both packages with `-V`.
    generate:
      description: Regenerate library sources
      # remix_fortal's generator resolves package:remix, so it must not build
      # while remix is rewriting its own lib/.
      exec:
        command: dart run build_runner build
        concurrency: 1
        orderDependents: true
      packageFilters:
        scope: [remix, remix_fortal, remix_carbon]

    generate:check:
      description: Regenerate library sources and fail only on generated drift
      exec:
        command: dart run ../../tool/check_generated.dart
        concurrency: 1
        orderDependents: true
      packageFilters:
        scope: [remix, remix_fortal, remix_carbon]

    remix_carbon:tokens:check:
      run: node packages/remix_carbon/tool/verify_generated.mjs
      description: Verify Carbon token sources reproduce committed Dart output

    remix_carbon:icons:generate:
      steps:
        - uv run --frozen --project packages/remix_carbon/tool/carbon_icons python packages/remix_carbon/tool/carbon_icons/prepare.py
        - uv run --frozen --project packages/remix_carbon/tool/carbon_icons glyphpact --config packages/remix_carbon/tool/carbon_icons/glyphpact.json
      description: Regenerate the locked CarbonIcons font and Dart provider

    remix_carbon:icons:check:
      steps:
        - uv run --frozen --project packages/remix_carbon/tool/carbon_icons python packages/remix_carbon/tool/carbon_icons/prepare.py
        - uv run --frozen --project packages/remix_carbon/tool/carbon_icons glyphpact --config packages/remix_carbon/tool/carbon_icons/glyphpact.json --check
        - uv run --frozen --project packages/remix_carbon/tool/carbon_icons python packages/remix_carbon/tool/carbon_icons/verify.py
      description: Verify the complete pinned Carbon icon catalog and generated artifacts

    dcm:check:
      exec: dcm analyze lib --fatal-style --fatal-warnings --no-congratulate
      description: Run Remix Dart Code Metrics with all severities fatal
      packageFilters:
        scope: [remix, remix_fortal]

    dcm:check:remix_carbon:
      exec: dcm analyze lib --fatal-style --fatal-warnings --no-congratulate
      description: Run Carbon Dart Code Metrics with all severities fatal
      packageFilters:
        scope: [remix_carbon, remix_carbon_example]

    remix_carbon:catalog:web:
      exec: flutter build web --release
      description: Build the Remix Carbon component catalog for the web
      packageFilters:
        scope: remix_carbon_example

    test:flutter:
      exec: flutter test --reporter=failures-only
      description: Run flutter test
      packageFilters:
        dirExists: test

    version:align:check:
      run: dart run tool/check_version_alignment.dart
      description: Verify remix and remix_fortal carry the identical version

    mix:consumer:check:
      run: dart run tool/check_consumer_mix.dart
      description: Verify consumer tests resolve the declared hosted Mix release

    toolchain:check:
      run: dart run tool/check_toolchain.dart
      description: Verify every package declares the melos-managed toolchain floor

    material:check:
      run: dart run tool/check_material_independence.dart
      description: Verify published Remix libraries contain no direct Material usage

    icons:generate:
      steps:
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons glyphpact --config packages/remix_ui_icons/tool/radix_icons/glyphpact.json
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python packages/remix_ui_icons/tool/radix_icons/generate_icons_index.py
      description: Regenerate the locked RemixIcons font, Dart provider, and opt-in index

    icons:check:
      steps:
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons glyphpact --config packages/remix_ui_icons/tool/radix_icons/glyphpact.json --check
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python -m unittest discover -s packages/remix_ui_icons/tool/radix_icons -p 'test_*.py'
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python packages/remix_ui_icons/tool/radix_icons/verify.py
      description: Verify the pinned Radix snapshot, generated icon artifacts, and opt-in index

    ci:
      steps:
        - toolchain:check
        - version:align:check
        - mix:consumer:check
        - material:check
        - remix_carbon:tokens:check
        - remix_carbon:icons:check
        - generate:check
        - docs:check
        - fortal:parity:check
        - dcm:check
        - dcm:check:remix_carbon
        - remix_carbon:catalog:web
        - test:flutter
      description: Verify dependencies, generated sources, docs, parity, DCM, and tests

    fortal:parity:check:
      exec: dart run tool/fortal_parity/check.dart
      description: Verify the pinned Radix Themes 3.3.0 parity contract and coverage
      packageFilters:
        scope: remix_fortal

    docs:catalog:
      run: dart run tool/generate_fortal_catalog.dart
      description: Regenerate the Fortal widget catalog from the parity manifest

    docs:check:
      # The catalog is rendered from the same manifest `fortal:parity:check`
      # holds against the recipes, so a stale page is drift, not a doc edit.
      steps:
        - dart run tool/validate_docs.dart
        - dart run tool/generate_fortal_catalog.dart --check
      description: Validate docs, reject retired APIs, and fail on catalog drift
