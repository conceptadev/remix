name: remix_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dev_dependencies:
  melos: ^8.2.1
  dart_code_metrics_presets: ^2.32.0
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

workspace:
  - packages/carbon
  - packages/carbon/example
  - packages/demo
  - packages/example
  - packages/playground
  - packages/remix

melos:
  packages:
    - packages/*
    # `packages/*` does not cross path separators; nested workspace members
    # must be listed explicitly or melos scripts silently skip them.
    - packages/carbon/example

  command:
    bootstrap:
      environment:
        sdk: ">=3.12.0 <4.0.0"
        flutter: ">=3.44.0"

  scripts:
    generate:
      exec: dart run build_runner build
      description: Regenerate Remix sources
      packageFilters:
        scope: remix

    generate:check:
      exec: dart run tool/check_generated.dart
      description: Regenerate Remix sources and fail only on generated drift

    dcm:check:
      exec: dcm analyze lib --fatal-style --fatal-warnings --no-congratulate
      description: Run Remix Dart Code Metrics with all severities fatal
      packageFilters:
        scope: remix

    dcm:check:carbon:
      exec: dcm analyze lib --fatal-style --fatal-warnings --no-congratulate
      description: Run Carbon Dart Code Metrics with all severities fatal
      packageFilters:
        scope: carbon

    test:flutter:
      exec: flutter test --reporter=failures-only
      description: Run flutter test
      packageFilters:
        dirExists: test

    mix:consumer:check:
      run: dart run tool/check_consumer_mix.dart
      description: Verify consumer tests resolve the declared hosted Mix release

    ci:
      steps:
        - mix:consumer:check
        - generate:check
        - docs:check
        - fortal:parity:check
        - dcm:check
        - dcm:check:carbon
        - test:flutter
      description: Verify hosted Mix, generated sources, docs, Fortal parity, DCM, and tests

    fortal:parity:check:
      exec: dart run tool/fortal_parity/check.dart
      description: Verify the pinned Radix Themes 3.3.0 parity contract and coverage
      packageFilters:
        scope: remix

    docs:check:
      exec: dart run tool/validate_docs.dart
      description: Reject retired APIs in docs and examples, then analyze MDX Dart snippets
      packageFilters:
        scope: remix
