name: remix_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dev_dependencies:
  melos: ^7.1.1
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

workspace:
  - apps/dashboard
  - apps/demo
  - apps/playground
  - packages/remix
  - packages/remix_fortal

melos:
  packages:
    - apps/*
    - packages/*

  # No `command.bootstrap.environment` here on purpose. It rewrites one
  # `environment:` into every package it manages, and this workspace has two
  # legitimate floors: the published libraries ship code that runs on Mix's
  # Flutter 3.41, while the dev toolchain (analyzer, via build_runner) needs
  # meta 1.18 and therefore Flutter 3.44. Melos offers no per-package
  # exemption, so a single managed value could only be wrong for one group.
  # tool/check_toolchain.dart owns both floors and enforces them instead.

  command:
    version:
      # The aggregate workspace changelog is not published and duplicates the
      # per-package ones, so a `melos version` run should not create it.
      workspaceChangelog: false

    bootstrap:
      # Mix floors are managed here so `remix` and `remix_fortal` cannot drift
      # apart. Unlike `environment` above, this is safe to manage centrally:
      # melos skips any package that does not already declare the dependency
      # (see `_updateDependencies` in melos), so the apps keep resolving Mix
      # transitively and never gain a direct dependency.
      #
      # Keep these at the versions actually exercised by CI. Declaring an older
      # floor than we test would claim support for a Mix we never build against.
      # tool/check_consumer_mix.dart enforces the same equality for anyone who
      # edits a pubspec without bootstrapping.
      dependencies:
        mix: ^2.2.0-beta.4
        mix_annotations: ^2.2.0-beta.1
      dev_dependencies:
        mix_generator: ^2.2.0-beta.2

  scripts:
    # Named `release:*` rather than `version`: a script named `version` shadows
    # melos's built-in `melos version` command, so the script body could never
    # invoke it.
    release:version:
      # Bumps the beta line rather than graduating to a stable major: breaking
      # changes during a prerelease increment `beta.N`, they do not force 2.0.0.
      #
      # Tags are left to the release step. `publish.yml` fires on a tag push, so
      # tagging here would publish before the version PR is reviewed.
      run: >-
        melos version --prerelease --preid beta --no-git-tag-version --yes
      description: >-
        Bump prerelease versions and changelogs from conventional commits

    release:graduate:
      # For the 1.0.0 release: drops the prerelease suffix from every package.
      run: melos version --graduate --no-git-tag-version --yes
      description: Graduate the prerelease line to stable versions

    generate:
      run: dart run build_runner build
      description: Regenerate Remix sources
      # remix_fortal's generator resolves package:remix, so it must not build
      # while remix is rewriting its own lib/.
      exec:
        concurrency: 1
        orderDependents: true
      packageFilters:
        scope: [remix, remix_fortal]

    generate:check:
      run: dart run ../../tool/check_generated.dart
      description: Regenerate Remix sources and fail only on generated drift
      exec:
        concurrency: 1
        orderDependents: true
      packageFilters:
        scope: [remix, remix_fortal]

    test:flutter:
      exec: flutter test --reporter=failures-only
      description: Run flutter test
      packageFilters:
        dirExists: test

    mix:consumer:check:
      run: dart run tool/check_consumer_mix.dart
      description: Verify consumer tests resolve the declared hosted Mix release

    toolchain:check:
      run: dart run tool/check_toolchain.dart
      description: Verify every package declares the melos-managed toolchain floor

    material:check:
      run: dart run tool/check_material_independence.dart
      description: Verify published Remix libraries contain no direct Material usage

    fortal:icons:generate:
      run: uv run --frozen --project packages/remix_fortal/tool/radix_icons glyphpact --config packages/remix_fortal/tool/radix_icons/glyphpact.json
      description: Regenerate the locked FortalIcons font and Dart provider

    fortal:icons:check:
      steps:
        - uv run --frozen --project packages/remix_fortal/tool/radix_icons glyphpact --config packages/remix_fortal/tool/radix_icons/glyphpact.json --check
        - uv run --frozen --project packages/remix_fortal/tool/radix_icons python packages/remix_fortal/tool/radix_icons/verify.py
      description: Verify the pinned Radix snapshot and generated icon artifacts

    ci:
      steps:
        - toolchain:check
        - mix:consumer:check
        - material:check
        - generate:check
        - docs:check
        - fortal:parity:check
        - test:flutter
      description: Verify generated sources, docs, Fortal parity, and tests

    fortal:parity:check:
      exec: dart run tool/fortal_parity/check.dart
      description: Verify the pinned Radix Themes 3.3.0 parity contract and coverage
      packageFilters:
        scope: remix_fortal

    docs:check:
      run: dart run tool/validate_docs.dart
      description: Validate docs and reject retired APIs across workspace sources
